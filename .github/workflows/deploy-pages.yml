# Deploys the repo root as a static site to GitHub Pages.
#
# One-time per repository (required or configure-pages fails with "Get Pages site ... Not Found"):
#   GitHub → Settings → Pages → Build and deployment → Source: GitHub Actions
# Then re-run this workflow (Actions tab → Deploy to GitHub Pages → Re-run jobs).
#
# Optional: actions/configure-pages "enablement" needs a token other than GITHUB_TOKEN (e.g. PAT);
# enabling Pages in the UI avoids that.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
